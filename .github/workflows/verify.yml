name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # CJK 字体是出图必需的。apt 镜像偶发卡死会把整个 job 拖到 15 分钟超时被取消
      # （2026-08-05 发生过一次），故给这一步单独设短超时并重试。
      - name: Install deps
        timeout-minutes: 6
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              && sudo apt-get install -y -qq --no-install-recommends \
                 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 fonts-noto-cjk \
              && break
            echo "apt 第 $i 次失败，重试"; sleep 10
          done
          fc-list | grep -qi "noto sans cjk" || { echo "::error::CJK 字体未安装"; exit 1; }
          python -m pip install --quiet matplotlib
      # 门 0：verifier。凡能自动判定的一律在这里裁决，不留给评审意见（report.md §8.1）
      - name: Recompute derived data from raw/
        run: python3 scripts/analyze.py
      - name: Assert derived data is unchanged
        run: git diff --exit-code -- derived/
      - name: Regenerate figures
        run: python3 scripts/plot.py
      - name: Assert references and BibTeX are up to date
        run: python3 scripts/gen_references.py --check
      - name: Assert LaTeX in Markdown renders on GitHub
        run: python3 scripts/check_math.py
      - name: Assert every claim in the prose matches derived/stats.json
        run: python3 scripts/verify.py
